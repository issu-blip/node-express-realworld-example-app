name : CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: lint
        run: npx nx lint api
      

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npx nx test api


  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  
  build-and-deploy:
    #if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: >-
        ${{
        !cancelled() && github.event_name == 'push' &&
        github.ref == 'refs/heads/main' && needs.security.result == 'success'
        }}
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - security
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check aws identity
        run: aws sts get-caller-identity

      - name: login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build docker image
        run: | 
              docker build -t ${{ steps.login-ecr.outputs.registry }}/realworld-api:${{ github.sha }} .
              docker tag ${{ steps.login-ecr.outputs.registry }}/realworld-api:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/realworld-api:latest

      - name: push image to ECR
        run: |
              docker push ${{ steps.login-ecr.outputs.registry }}/realworld-api:${{ github.sha }}
              docker push ${{ steps.login-ecr.outputs.registry }}/realworld-api:latest

      - name: Deploy to ECS
        run: |
            aws ecs update-service --cluster realworld-api-cluster --service realworld-api-service --force-new-deployment
            aws ecs wait services-stable --cluster realworld-api-cluster --services realworld-api-service
